# Ablation study configuration.
#
# Config resolution: root `base` → group `group_base` → experiment `delta`
# Each level overwrites the previous. All keys map to flat hparam names.
#
# Skip resolution (highest priority wins):
#   experiment.skip > group.default_skip > global default_skip
#   Values: true (always skip), auto (skip if results exist), false (always run)
#
# Runtime hparams (use_compile, use_bf16, etc.) don't affect model quality
# but are included in base for full reproducibility.

default_skip: auto

# ============================================================
# Root base: exact train_old.py reproduction (all hparams)
# ============================================================
base:
  # --- ModelArchHparams ---
  layer_pattern: AAAAAA     # n_layer=6
  vocab_size: 16000
  d_model: 512
  dropout: 0.1
  norm: layernorm
  pos_emb: learned
  use_rezero: false
  use_token_anchor: false
  use_resid_scale: false
  weight_init: gpt2
  tie_weights: false
  norm_emb: false
  logit_softcap: 0.0
  mlp_act: gelu
  mlp_expand: 4.0
  # --- AttentionHparams ---
  n_q_head: 8
  n_kv_heads: 8             # MHA
  separate_kv: false
  use_value_residual: false
  use_value_residual_x0: false
  use_value_carry: false
  ve_gate_channels: 12
  # --- MambaHparams (inactive — no M layers) ---
  expand: 2
  d_head: 64
  d_state: 128
  n_groups: 1
  d_conv: 4
  chunk_len: 64
  # --- OptimizerHparams ---
  optimizer_type: sgd
  muon_lr: 0.02
  muon_attn_only: false
  mlp_lr: 3.0e-4
  adamw_lr: 3.0e-4
  emb_lr: 3.0e-3
  scalar_lr: 1.0e-3
  adamw_wd: 0.1
  sgd_lr: 6.0e-3
  sgd_wd: 0.0
  lr_schedule: cosine
  warmup_frac: 0.0
  decay_frac: 0.60
  min_lr_frac: 0.0
  plateau_factor: 0.5
  plateau_patience: 3
  sgdr_t0_frac: 0.43
  wsd_n_cycles: 2
  wsd_cycle_lr_decay: 1.0
  spectral_clip: 0.0
  # --- TrainHparams ---
  batch_size: 64
  block_size: 128
  clip_norm_mode: all
  # --- RuntimeHparams ---
  use_fa2: true
  use_fused_ce: false
  use_compile: true
  use_bf16: true
  evals_per_epoch: 1
  use_tqdm: true
  # --- FixedHparams ---
  epochs: 7
  seed: 1337
  num_titles: 100000
  val_frac: 0.10

# ============================================================
# Groups
# ============================================================
groups:

  # ----------------------------------------------------------
  - name: group1
    desc: "Optimizer isolation (train_old base, no arch changes)"
    group_base: {}
    experiments:
      - name: g1_00_baseline
        desc: "baseline reproduction"

      - name: g1_01_muon
        desc: "Muon+AdamW only, all else unchanged"
        delta:
          optimizer_type: muon_adamw

      - name: g1_02_muon_init
        desc: "Muon+AdamW + muon_uniform init"
        delta:
          optimizer_type: muon_adamw
          weight_init: muon_uniform

      - name: g1_03_muon_rezero
        desc: "Muon+AdamW + ReZero (gpt2 init)"
        delta:
          optimizer_type: muon_adamw
          use_rezero: true

      - name: g1_04_muon_init_rezero
        desc: "Muon+AdamW + muon_uniform init + ReZero"
        delta:
          optimizer_type: muon_adamw
          weight_init: muon_uniform
          use_rezero: true

      - name: g1_05_muon_uni_init_rope
        desc: "Muon+AdamW + muon_uniform init + rope"
        delta:
          optimizer_type: muon_adamw
          weight_init: muon_uniform
          pos_emb: rope

      - name: g1_06_muon_clip_adamw
        desc: "Muon+AdamW + clip_norm_mode=adamw (skip clipping muon params)"
        delta:
          optimizer_type: muon_adamw
          clip_norm_mode: adamw

      - name: g1_07_muon_init_clip_adamw
        desc: "Muon+AdamW + muon_uniform init + clip_norm_mode=adamw"
        delta:
          optimizer_type: muon_adamw
          weight_init: muon_uniform
          clip_norm_mode: adamw

      - name: g1_08_muon_rope
        desc: "Muon+AdamW + rope (gpt2 init)"
        delta:
          optimizer_type: muon_adamw
          pos_emb: rope

      - name: g1_09_muon_wsd
        desc: "Muon+AdamW + WSD schedule (gpt2 init)"
        delta:
          optimizer_type: muon_adamw
          lr_schedule: wsd
          warmup_frac: 0.05
          min_lr_frac: 0.05

      - name: g1_10_muon_init_wsd
        desc: "Muon+AdamW + WSD + muon_uniform init"
        delta:
          optimizer_type: muon_adamw
          lr_schedule: wsd
          warmup_frac: 0.05
          min_lr_frac: 0.05
          weight_init: muon_uniform

      - name: g1_11_muon_rope_wsd
        desc: "Muon+AdamW + rope + WSD (gpt2 init)"
        delta:
          optimizer_type: muon_adamw
          pos_emb: rope
          lr_schedule: wsd
          warmup_frac: 0.05
          min_lr_frac: 0.05

      - name: g1_12_muon_rope_init_wsd
        desc: "Muon+AdamW + rope + WSD + muon_uniform init"
        delta:
          optimizer_type: muon_adamw
          pos_emb: rope
          lr_schedule: wsd
          warmup_frac: 0.05
          min_lr_frac: 0.05
          weight_init: muon_uniform

  # ----------------------------------------------------------
  - name: group2
    desc: "Architecture tricks (best optimizer from group1: muon+rope+wsd+gpt2init)"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
    experiments:
      - name: g2_00_base
        desc: "Group2 base: muon+rope+wsd, no arch tricks"

      - name: g2_01_token_anchor
        desc: "Token anchor (per-layer learnable skip from embedding)"
        delta:
          use_token_anchor: true

      - name: g2_02_softcap
        desc: "Logit tanh softcap (cap=15)"
        delta:
          logit_softcap: 15.0

      - name: g2_03_rmsnorm
        desc: "RMSNorm instead of LayerNorm"
        delta:
          norm: rmsnorm

      - name: g2_04_mqa
        desc: "Multi-query attention (1 KV head)"
        delta:
          n_kv_heads: 1

      - name: g2_05_tie_weights
        desc: "Tie lm_head weights to token embedding"
        delta:
          tie_weights: true

      - name: g2_06_anchor_softcap
        desc: "Token anchor + logit softcap (expected best combo)"
        delta:
          use_token_anchor: true
          logit_softcap: 15.0

      - name: g2_07_swiglu
        desc: "SwiGLU activation (iso-param vs GELU)"
        delta:
          mlp_act: swiglu

      - name: g2_08_relu_sq
        desc: "ReLU² activation"
        delta:
          mlp_act: relu_sq

      - name: g2_09_swiglu_tie
        desc: "SwiGLU + tie_weights"
        delta:
          mlp_act: swiglu
          tie_weights: true

      - name: g2_10_relu_sq_tie
        desc: "ReLU² + tie_weights"
        delta:
          mlp_act: relu_sq
          tie_weights: true

  # ----------------------------------------------------------
  - name: group3
    desc: "Additive chain on best config (swiglu+tie base)"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      mlp_act: swiglu
      tie_weights: true
    experiments:
      - name: g3_00_base
        desc: "Group3 base: muon+rope+wsd+swiglu+tie (best so far 1.1836)"

      - name: g3_01_rmsnorm
        desc: "+RMSNorm"
        delta:
          norm: rmsnorm

      - name: g3_02_token_anchor
        desc: "+token anchor"
        delta:
          use_token_anchor: true

      - name: g3_03_softcap
        desc: "+logit softcap"
        delta:
          logit_softcap: 15.0

      - name: g3_04_mqa
        desc: "+MQA (1 KV head)"
        delta:
          n_kv_heads: 1

      - name: g3_05_anchor_softcap
        desc: "+token anchor + softcap"
        delta:
          use_token_anchor: true
          logit_softcap: 15.0

  # ----------------------------------------------------------
  - name: group4
    desc: "Architecture scale: best config (swiglu+tie+rope+muon+wsd) on larger arch"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      mlp_act: swiglu
      tie_weights: true
    experiments:
      - name: g4_00_base
        desc: "Group4 base: best config, train_old scale (6L×512d×vocab16k)"

      - name: g4_01_8k
        desc: "vocab 16k → 8k (keep 6L×512d)"
        delta:
          vocab_size: 8192

      - name: g4_02_12A
        desc: "6 layers → 12 layers (keep 512d×vocab16k)"
        delta:
          layer_pattern: AAAAAAAAAAAA

      - name: g4_03_8k_12A
        desc: "vocab 8k + 12 layers (keep 512d)"
        delta:
          vocab_size: 8192
          layer_pattern: AAAAAAAAAAAA

  # ----------------------------------------------------------
  - name: group5
    desc: "Iso-param arch search within ~30M params (16k vocab, head_dim=64 throughout)"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      mlp_act: swiglu
      tie_weights: true
    experiments:
      - name: g5_00_base
        desc: "Group5 base: best config 6L×512d×16k (26.8M) — reuse g4_00_base result"
        skip: auto

      - name: g5_01_8L_448
        desc: "8L×448d×16k (26.4M) — wider than 384, deeper than 512"
        delta:
          layer_pattern: AAAAAAAA
          d_model: 448
          n_q_head: 7
          n_kv_heads: 7

      - name: g5_02_9L_448
        desc: "9L×448d×16k (28.8M) — one more layer"
        delta:
          layer_pattern: AAAAAAAAA
          d_model: 448
          n_q_head: 7
          n_kv_heads: 7

      - name: g5_03_12L_384
        desc: "12L×384d×16k (27.4M) — deeper narrow"
        delta:
          layer_pattern: AAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 6

      - name: g5_04_13L_384
        desc: "13L×384d×16k (29.0M) — deepest narrow"
        delta:
          layer_pattern: AAAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 6

      - name: g5_05_5L_576
        desc: "5L×576d×16k (29.1M) — shallower wider"
        delta:
          layer_pattern: AAAAA
          d_model: 576
          n_q_head: 9
          n_kv_heads: 9

      - name: g5_06_4L_640
        desc: "4L×640d×16k (29.9M) — shallowest widest"
        delta:
          layer_pattern: AAAA
          d_model: 640
          n_q_head: 10
          n_kv_heads: 10

  # ----------------------------------------------------------
  - name: group6
    desc: "Arch search up to 40M: deeper 384d MHA, 320d ultra-deep, GQA-2 for depth budget"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      mlp_act: swiglu
      tie_weights: true
    experiments:
      - name: g6_00_base
        desc: "Group6 base: best config 12L×384d×16k MHA (27.4M) — reuse g5_03"
        skip: auto

      # 384d MHA: push depth further (40M budget)
      - name: g6_01_14L_384
        desc: "14L×384d MHA (30.9M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 6

      - name: g6_02_16L_384
        desc: "16L×384d MHA (34.5M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 6

      - name: g6_03_18L_384
        desc: "18L×384d MHA (38.0M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 6

      - name: g6_04_19L_384
        desc: "19L×384d MHA (39.8M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 6

      # 320d MHA: narrower + deeper (same budget range)
      - name: g6_05_20L_320
        desc: "20L×320d MHA (29.7M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAA
          d_model: 320
          n_q_head: 5
          n_kv_heads: 5

      - name: g6_06_24L_320
        desc: "24L×320d MHA (34.6M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAA
          d_model: 320
          n_q_head: 5
          n_kv_heads: 5

      - name: g6_07_28L_320
        desc: "28L×320d MHA (39.5M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
          d_model: 320
          n_q_head: 5
          n_kv_heads: 5

      # 384d GQA-2: KV savings → more depth at same param budget
      - name: g6_08_16L_384_gqa2
        desc: "16L×384d GQA-2 (31.3M) — iso-param vs 14L MHA, +2 layers"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 2

      - name: g6_09_21L_384_gqa2
        desc: "21L×384d GQA-2 (39.2M) — deepest possible at 40M with GQA-2"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAA
          d_model: 384
          n_q_head: 6
          n_kv_heads: 2

  # ----------------------------------------------------------
  - name: group7
    desc: "256d ultra-deep: does narrower+deeper trend continue past 320d?"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      mlp_act: swiglu
      tie_weights: true
    experiments:
      - name: g7_01_28L_256
        desc: "28L×256d MHA (26.1M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
          d_model: 256
          n_q_head: 4
          n_kv_heads: 4

      - name: g7_02_32L_256
        desc: "32L×256d MHA (29.3M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          d_model: 256
          n_q_head: 4
          n_kv_heads: 4

      - name: g7_03_36L_256
        desc: "36L×256d MHA (32.4M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          d_model: 256
          n_q_head: 4
          n_kv_heads: 4

      - name: g7_04_40L_256
        desc: "40L×256d MHA (35.6M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          d_model: 256
          n_q_head: 4
          n_kv_heads: 4

      - name: g7_05_44L_256
        desc: "44L×256d MHA (38.7M)"
        delta:
          layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          d_model: 256
          n_q_head: 4
          n_kv_heads: 4

  # ----------------------------------------------------------
  - name: group8
    desc: "Depth-dependent tricks on best arch (28L×256d): token_anchor, softcap, resid_scale"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      mlp_act: swiglu
      tie_weights: true
      layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
      d_model: 256
      n_q_head: 4
      n_kv_heads: 4
    experiments:
      - name: g8_00_base
        desc: "Group8 base: 28L×256d (26.6M) — reuse g7_01 result"
        skip: auto

      - name: g8_01_anchor
        desc: "+token_anchor"
        delta:
          use_token_anchor: true

      - name: g8_02_softcap
        desc: "+logit_softcap=15"
        delta:
          logit_softcap: 15.0

      - name: g8_03_anchor_softcap
        desc: "+token_anchor +softcap"
        delta:
          use_token_anchor: true
          logit_softcap: 15.0

      - name: g8_04_anchor_scale
        desc: "+token_anchor +resid_scale"
        delta:
          use_token_anchor: true
          use_resid_scale: true

      - name: g8_05_all
        desc: "+token_anchor +resid_scale +softcap"
        delta:
          use_token_anchor: true
          use_resid_scale: true
          logit_softcap: 15.0

      - name: g8_06_anchor_rezero
        desc: "+token_anchor +rezero"
        delta:
          use_token_anchor: true
          use_rezero: true

      - name: g8_07_rezero
        desc: "+rezero only"
        delta:
          use_rezero: true

  # ----------------------------------------------------------
  - name: group9
    desc: "Value Residual on 28L×256d: V = Wv(x) + x (zero extra params)"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      mlp_act: swiglu
      tie_weights: true
      layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
      d_model: 256
      n_q_head: 4
      n_kv_heads: 4
    experiments:
      - name: g9_00_base
        desc: "Group9 base: 28L×256d — reuse g7_01 result"
        skip: auto

      - name: g9_01_value_res
        desc: "Value residual only"
        delta:
          use_value_residual: true

      - name: g9_02_value_res_anchor
        desc: "Value residual + token_anchor"
        delta:
          use_value_residual: true
          use_token_anchor: true

      - name: g9_03_value_res_softcap
        desc: "Value residual + logit_softcap"
        delta:
          use_value_residual: true
          logit_softcap: 15.0

      - name: g9_04_value_res_all
        desc: "Value residual(x) + token_anchor + softcap"
        delta:
          use_value_residual: true
          use_token_anchor: true
          logit_softcap: 15.0

      - name: g9_05_value_res_x0
        desc: "Value residual x₀ (original embedding) only"
        delta:
          use_value_residual_x0: true

      - name: g9_06_value_res_x0_anchor
        desc: "Value residual x₀ + token_anchor"
        delta:
          use_value_residual_x0: true
          use_token_anchor: true

      - name: g9_07_both_res
        desc: "Value residual x + x₀ combined"
        delta:
          use_value_residual: true
          use_value_residual_x0: true

      - name: g9_08_value_carry
        desc: "Value carry: v_l = Wv(x) + λ*v_{l-1}, λ init=0"
        delta:
          use_value_carry: true

      - name: g9_09_value_carry_anchor
        desc: "Value carry + token_anchor"
        delta:
          use_value_carry: true
          use_token_anchor: true

      - name: g9_10_anchor_only
        desc: "token_anchor only — reference within group9"
        delta:
          use_token_anchor: true

  # ----------------------------------------------------------
  - name: group10
    desc: "Vocab size sweep around 16k optimum (28L×256d best config)"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      decay_frac: 0.60
      dropout: 0.1
      mlp_act: swiglu
      tie_weights: true
      use_token_anchor: true
      layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
      d_model: 256
      n_q_head: 4
      n_kv_heads: 4
    experiments:
      - name: g10_00_base
        desc: "Control: 16k vocab (best from group4)"
        skip: auto

      - name: g10_01_vocab10k
        desc: "vocab=10240 — between 8k (hurt) and 16k (best)"
        delta:
          vocab_size: 10240

      - name: g10_02_vocab12k
        desc: "vocab=12288 — between 8k (hurt) and 16k (best)"
        delta:
          vocab_size: 12288

      - name: g10_03_vocab8k
        desc: "vocab=8192 — between 8k (hurt) and 16k (best)"
        delta:
          vocab_size: 8192

      - name: g10_04_separate_kv_vocab_10k
        desc: "vocab=10240, Split kv_proj into k_proj+v_proj: all attention matrices become [256,256] square for Muon"
        delta:
          separate_kv: true
          vocab_size: 10240

      - name: g10_05_spectral_clip
        desc: "spectral_clip=1.0 on vocab=10240 best config — enforce near-orthogonal weight matrices"
        delta:
          vocab_size: 10240
          spectral_clip: 1.0

      - name: g10_06_muon_attn_only
        desc: "MLP matrices use AdamW instead of Muon — Muon only on square attn projections"
        delta:
          vocab_size: 10240
          muon_attn_only: true

      - name: g10_07_muon_attn_only_mlp1e3
        desc: "muon_attn_only + mlp_lr=1e-3 — test higher AdamW LR for MLP matrices"
        delta:
          vocab_size: 10240
          muon_attn_only: true
          mlp_lr: 1.0e-3

      - name: g10_08_mlp2x
        desc: "mlp_expand=3.0 → hidden=512 (2:1 ratio) — more square for Muon, ~27% fewer MLP params"
        delta:
          vocab_size: 10240
          mlp_expand: 3.0

      - name: g10_09_mlp1p5x
        desc: "mlp_expand=2.25 → hidden=384 (1.5:1 ratio) — even more square, ~45% fewer MLP params"
        delta:
          vocab_size: 10240
          mlp_expand: 2.25

  - name: group11
    desc: "Value Embedding (E layers) — ResFormer-style token-identity injection into V, gated per-head"
    group_base:
      optimizer_type: muon_adamw
      pos_emb: rope
      lr_schedule: wsd
      warmup_frac: 0.05
      min_lr_frac: 0.05
      decay_frac: 0.60
      dropout: 0.1
      mlp_act: swiglu
      mlp_expand: 4.0
      tie_weights: true
      use_token_anchor: true
      vocab_size: 16000
      layer_pattern: AAAAAAAAAAAAAAAAAAAAAAAAAAAA
      d_model: 256
      n_q_head: 4
      n_kv_heads: 4
    experiments:
      - name: g11_00_base
        desc: "vocab=16k. Control: 28A, vocab=16000, no VE (g10_01 repeat)"
        skip: auto

      - name: g11_01_ve_2e
        desc: "vocab=16k. 2 E layers at pos 9,19 — AAAAAAAAAEAAAAAAAAAEAAAAAAAA"
        delta:
          layer_pattern: AAAAAAAAAEAAAAAAAAAEAAAAAAAA

      - name: g11_02_ve_3e
        desc: "vocab=16k. 3 E layers at pos 9,18,27 — AAAAAAAAAEAAAAAAAAEAAAAAAAAE"
        delta:
          layer_pattern: AAAAAAAAAEAAAAAAAAEAAAAAAAAE

      - name: g11_03_ve_2e_gate16
        desc: "vocab=16k. 2 E layers, ve_gate_channels=16 — more gate capacity"
        delta:
          layer_pattern: AAAAAAAAAEAAAAAAAAAEAAAAAAAA
