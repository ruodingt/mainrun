version: '3'

includes:
  dc:
    taskfile: .devcontainer/Taskfile.yml
    dir: .devcontainer

vars:
  SSH: ssh -T amd-container
  WORK_DIR: ~/workspace/mainrun
  PYTHON: /opt/venv/bin/python

tasks:
  checkpoint:
    dir: scripts
    cmds:
      - npx zx checkpoint.mjs

  download:
    dir: mainrun
    cmds:
      - python3 download_dataset.py

  fetch-best-config:
    desc: Scan ablation logs and write best_config.yaml (manual trigger)
    cmds:
      - python3 tools/fetch_best_config.py

  fetch-best-config-remote:
    desc: Fetch best config on remote, then sync it locally
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && {{.PYTHON}} tools/fetch_best_config.py"'
      - rsync -avz amd-container:{{.WORK_DIR}}/mainrun/configs/best_config.yaml mainrun/mainrun/configs/

  fetch-ablation-results:
    desc: "Pull ablation results from remote and organise logs (usage: task fetch-ablation-results -- group1)"
    cmds:
      - python tools/fetch_ablation_results.py {{.CLI_ARGS}}

  train:
    deps: [checkpoint, download]
    dir: mainrun
    cmds:
      - python3 train_hybrid.py

  train-local:
    desc: Run train_hybrid locally (with checkpoint)
    deps: [checkpoint]
    dir: mainrun/mainrun
    cmds:
      - python3 train_hybrid.py

  train-remote:
    desc: Run train_hybrid on remote server (with checkpoint, then sync)
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && {{.PYTHON}} train_hybrid.py {{.CLI_ARGS}}"'
      - task: sync

  train-nohup:
    desc: Run train_hybrid on remote server in background
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && nohup {{.PYTHON}} train_hybrid.py > logs/train.out 2>logs/train.err </dev/null & disown"'

  profile-remote:
    desc: "Profile training on remote with best config (usage: task profile-remote -- --profile-steps 20)"
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && {{.PYTHON}} train_hybrid.py --profile {{.CLI_ARGS}}"'

  rocprof-remote:
    desc: "rocprof --stats kernel timing on remote (usage: task rocprof-remote -- --profile-steps 10)"
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "mkdir -p ~/tmp && cd {{.WORK_DIR}} && rocprof --stats -o ~/tmp/rp_out.csv {{.PYTHON}} train_hybrid.py --profile {{.CLI_ARGS}}"'
      - '{{.SSH}} "sort -t, -k4 -rn ~/tmp/rp_out.stats.csv | head -30"'

  sync:
    desc: Pull remote logs and profile reports to local
    cmds:
      - rsync -avz amd-container:{{.WORK_DIR}}/logs/ mainrun/logs/
      - rsync -avz --include="*.md" --exclude="*" amd-container:{{.WORK_DIR}}/profile_out/ profile_out/

  logs:
    desc: Tail remote training log
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/logs/mainrun.log"'

  logs-tqdm:
    desc: Tail remote tqdm progress (stderr)
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/logs/train.err"'

  hypertune-remote:
    desc: "Launch hypertune (Optuna TPE) on remote in background (usage: task hypertune -- 60)"
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && nohup {{.PYTHON}} -u hypertune.py {{.CLI_ARGS}} > logs/hypertune.out 2>logs/hypertune.err </dev/null & disown"'

  hypertune-finish:
    desc: Sync results and checkpoint after hypertune completes
    cmds:
      - task: sync
      - task: checkpoint

  hypertune-results:
    desc: Print best trial from Optuna study
    cmds:
      - rsync -avz tools/hypertune_results.py amd-container:{{.WORK_DIR}}/tools/
      - '{{.SSH}} "cd {{.WORK_DIR}} && {{.PYTHON}} tools/hypertune_results.py"'

  hypertune-logs:
    desc: Tail hypertune progress on remote
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/logs/hypertune.out"'

  ablation-remote:
    desc: "Run ablation group on remote in background (usage: task ablation-remote -- group1)"
    deps: [checkpoint]
    cmds:
      - rsync -avz mainrun/configs/ablations.yaml amd-container:{{.WORK_DIR}}/mainrun/configs/
      - '{{.SSH}} "cd {{.WORK_DIR}} && nohup {{.PYTHON}} -u ablation.py --group {{.CLI_ARGS}} > logs/ablation.out 2>logs/ablation.err </dev/null & disown"'

  ablation-logs:
    desc: "Tail ablation progress on remote"
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/logs/ablation.out"'

  submit:
    deps: [checkpoint]
    dir: scripts
    cmds:
      - npx zx submit.mjs
