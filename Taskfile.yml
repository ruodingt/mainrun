version: '3'

includes:
  dc:
    taskfile: .devcontainer/Taskfile.yml
    dir: .devcontainer

vars:
  SSH: ssh amd-container
  WORK_DIR: ~/workspace/mainrun
  PYTHON: /opt/venv/bin/python

tasks:
  checkpoint:
    dir: scripts
    cmds:
      - npx zx checkpoint.mjs

  download:
    dir: mainrun
    cmds:
      - python3 download_dataset.py

  train:
    deps: [checkpoint, download]
    dir: mainrun
    cmds:
      - python3 train.py

  train-local:
    desc: Run train_hybrid locally (with checkpoint)
    deps: [checkpoint]
    dir: mainrun/mainrun
    cmds:
      - python3 train_hybrid.py

  train-remote:
    desc: Run train_hybrid on remote server (with checkpoint, then sync)
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && {{.PYTHON}} train_hybrid.py {{.CLI_ARGS}}"'
      - task: sync

  train-nohup:
    desc: Run train_hybrid on remote server in background
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && nohup {{.PYTHON}} train_hybrid.py > logs/train.out 2>logs/train.err </dev/null &"'

  sync:
    desc: Pull remote experiments and logs to local
    cmds:
      - rsync -avz amd-container:{{.WORK_DIR}}/logs/ mainrun/logs/

  logs:
    desc: Tail remote training log (stdout) and tqdm (stderr)
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/logs/mainrun.log"'

  logs-tqdm:
    desc: Tail remote tqdm progress (stderr)
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/logs/train.err"'

  hypertune:
    desc: "Launch hypertune on remote in background (usage: task hypertune -- plan|sweep|optuna)"
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && nohup {{.PYTHON}} hypertune.py {{.CLI_ARGS}} > logs/hypertune.out 2>logs/hypertune.err </dev/null &"'

  hypertune-finish:
    desc: Sync results and checkpoint after hypertune completes
    cmds:
      - task: sync
      - task: checkpoint

  ablation:
    desc: "Run ablation group on remote in background (usage: task ablation -- group1)"
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && nohup {{.PYTHON}} -u ablation.py --group {{.CLI_ARGS}} > logs/ablation.out 2>logs/ablation.err </dev/null &"'

  ablation-logs:
    desc: "Tail ablation progress on remote"
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/logs/ablation.out"'

  hypertune-logs:
    desc: Check hypertune progress on remote
    cmds:
      - '{{.SSH}} "ls -lt {{.WORK_DIR}}/logs/hypertune_*.log 2>/dev/null | head -20"'
      - '{{.SSH}} "tail -3 {{.WORK_DIR}}/logs/hypertune_*.log 2>/dev/null"'

  submit:
    deps: [checkpoint]
    dir: scripts
    cmds:
      - npx zx submit.mjs
