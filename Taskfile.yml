version: '3'

includes:
  dc:
    taskfile: .devcontainer/Taskfile.yml
    dir: .devcontainer

vars:
  SSH: ssh amd-container
  WORK_DIR: ~/workspace
  PYTHON: /opt/venv/bin/python

tasks:
  checkpoint:
    dir: scripts
    cmds:
      - npx zx checkpoint.mjs

  download:
    dir: mainrun
    cmds:
      - python3 download_dataset.py

  train:
    deps: [checkpoint, download]
    dir: mainrun
    cmds:
      - python3 train.py

  train-local:
    desc: Run train_hybrid locally (with checkpoint)
    deps: [checkpoint]
    dir: mainrun/mainrun
    cmds:
      - python3 train_hybrid.py

  train-remote:
    desc: Run train_hybrid on remote server (with checkpoint, then sync)
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}}/mainrun && {{.PYTHON}} train_hybrid.py"'
      - task: sync

  train-nohup:
    desc: Run train_hybrid on remote server in background
    deps: [checkpoint]
    cmds:
      - '{{.SSH}} "cd {{.WORK_DIR}} && nohup python3 train_hybrid.py > train.log 2>train.err &"'

  sync:
    desc: Pull remote experiments and logs to local
    cmds:
      - rsync -avz amd-container:{{.WORK_DIR}}/mainrun/experiments/ mainrun/mainrun/experiments/
      - rsync -avz amd-container:{{.WORK_DIR}}/mainrun/logs/ mainrun/mainrun/logs/

  logs:
    desc: Tail remote training log
    cmds:
      - '{{.SSH}} "tail -f {{.WORK_DIR}}/mainrun/logs/mainrun.log"'

  submit:
    deps: [checkpoint]
    dir: scripts
    cmds:
      - npx zx submit.mjs
